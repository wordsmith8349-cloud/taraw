[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taraw"
version = "0.1.0"
description = "A tiny, dependency-free repository hygiene checker"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "TARAW contributors"}]
keywords = ["cli", "code-quality", "repository", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
taraw = "taraw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
